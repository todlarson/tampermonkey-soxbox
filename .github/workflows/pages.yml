name: Publish site

# Publishes the install page (docs/) and every userscript (*.user.js) to GitHub Pages,
# so scripts install and auto-update from the site's own domain.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Privacy check
        run: bash scripts/check-private-data.sh

      - name: Assemble site
        run: |
          mkdir _site
          cp -r docs/. _site/
          cp *.user.js _site/
          ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
